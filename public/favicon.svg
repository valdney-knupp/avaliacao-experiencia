<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Símbolo Avaliação de Experiência">
  <defs>
    <linearGradient id="ael-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE787" />
      <stop offset="60%" stop-color="#54D769" />
      <stop offset="100%" stop-color="#2CA840" />
    </linearGradient>
    <linearGradient id="ael-arc-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54D769" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#54D769" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#A3F3B1" />
    </linearGradient>
    <linearGradient id="ael-shield-fill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#EDF8EE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#DDF0E1" stop-opacity="1" />
    </linearGradient>
    <filter id="ael-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#ael-shield-fill)" />

  <path d="M 12 36 A 23 23 0 1 1 52 38" stroke="url(#ael-arc-grad)" stroke-width="3.2" stroke-linecap="round" fill="none" />

  <path d="M 12 36 A 23 23 0 0 0 52 38" stroke="#000000" stroke-opacity="0.08" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4" fill="none" />

  <g>
    <circle cx="17" cy="20" r="3" fill="#54D769" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="17" cy="20" r="1.2" fill="#FFFFFF" />
  </g>

  <g>
    <circle cx="47" cy="20" r="3.5" fill="#54D769" stroke="#FFFFFF" stroke-width="1.5" filter="url(#ael-glow)" />
    <circle cx="47" cy="20" r="1.4" fill="#FFFFFF" />
  </g>

  <path d="M 32 15 L 43 21 V 34 C 43 41.5 38 46.5 32 49 C 26 46.5 21 41.5 21 34 V 21 Z" fill="#FFFFFF" stroke="#2CA840" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round" />

  <rect x="25.5" y="32" width="3.2" height="7.5" rx="1.2" fill="url(#ael-green-grad)" fill-opacity="0.55" />
  <rect x="30.4" y="28" width="3.2" height="11.5" rx="1.2" fill="url(#ael-green-grad)" fill-opacity="0.85" />
  <rect x="35.3" y="23.5" width="3.2" height="16" rx="1.2" fill="url(#ael-green-grad)" />

  <path d="M 26 31 L 31.5 36.5 L 44 24" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 26 31 L 31.5 36.5 L 44 24" stroke="#54D769" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
